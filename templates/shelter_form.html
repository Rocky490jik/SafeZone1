{% extends "base.html" %}

{% block title %}{{ action }} shelter - SafeZone Admin{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-sz">
          <div class="card-header">
            <h5 class="mb-0">{{ action }} shelter record</h5>
          </div>
          <div class="card-body p-4">
            <form method="POST" action="{% if shelter %}{{ url_for('admin.edit_shelter', shelter_id=shelter.shelter_id) }}{% else %}{{ url_for('admin.add_shelter') }}{% endif %}" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">Shelter code *</label>
                  <input type="text" name="shelter_code" class="form-control" value="{{ shelter.shelter_code if shelter else '' }}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Name *</label>
                  <input type="text" name="name" class="form-control" value="{{ shelter.name if shelter else '' }}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Type</label>
                  <select name="shelter_type" class="form-select">
                    <option value="OTHER" {% if shelter and shelter.shelter_type=='OTHER' %}selected{% endif %}>Other</option>
                    <option value="COMMUNITY_HALL" {% if shelter and shelter.shelter_type=='COMMUNITY_HALL' %}selected{% endif %}>Community hall</option>
                    <option value="SCHOOL" {% if shelter and shelter.shelter_type=='SCHOOL' %}selected{% endif %}>School</option>
                    <option value="GOVERNMENT_CENTRE" {% if shelter and shelter.shelter_type=='GOVERNMENT_CENTRE' %}selected{% endif %}>Government centre</option>
                    <option value="HEALTH_CENTRE" {% if shelter and shelter.shelter_type=='HEALTH_CENTRE' %}selected{% endif %}>Health centre</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Address *</label>
                  <input type="text" name="address" class="form-control" value="{{ shelter.address if shelter else '' }}" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label">City *</label>
                  <input type="text" name="city" class="form-control" value="{{ shelter.city if shelter else '' }}" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label">State</label>
                  <input type="text" name="state" class="form-control" value="{{ shelter.state if shelter else '' }}">
                </div>

                <div class="col-md-4">
                  <label class="form-label">Latitude</label>
                  <input type="number" step="any" name="latitude" class="form-control" value="{{ shelter.latitude if shelter else '' }}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Longitude</label>
                  <input type="number" step="any" name="longitude" class="form-control" value="{{ shelter.longitude if shelter else '' }}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Postal code</label>
                  <input type="text" name="postal_code" class="form-control" value="{{ shelter.postal_code if shelter else '' }}">
                </div>

                <div class="col-md-3">
                  <label class="form-label">Total capacity</label>
                  <input type="number" min="0" name="total_capacity" class="form-control" value="{{ shelter.total_capacity if shelter else '' }}" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Available capacity</label>
                  <input type="number" min="0" name="available_capacity" class="form-control" value="{{ shelter.available_capacity if shelter else '' }}" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Status</label>
                  <select name="status" class="form-select">
                    <option value="OPEN" {% if not shelter or shelter.status=='OPEN' %}selected{% endif %}>Open</option>
                    <option value="FULL" {% if shelter and shelter.status=='FULL' %}selected{% endif %}>Full</option>
                    <option value="CLOSED" {% if shelter and shelter.status=='CLOSED' %}selected{% endif %}>Closed</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Verification</label>
                  <select name="verification_status" class="form-select">
                    <option value="PENDING" {% if not shelter or shelter.verification_status=='PENDING' %}selected{% endif %}>Pending</option>
                    <option value="VERIFIED" {% if shelter and shelter.verification_status=='VERIFIED' %}selected{% endif %}>Verified</option>
                    <option value="REJECTED" {% if shelter and shelter.verification_status=='REJECTED' %}selected{% endif %}>Rejected</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Contact name</label>
                  <input type="text" name="contact_name" class="form-control" value="{{ shelter.contact_name if shelter else '' }}">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Contact phone</label>
                  <input type="tel" name="contact_phone" class="form-control" value="{{ shelter.contact_phone if shelter else '' }}">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Last verified at</label>
                  <input type="datetime-local" name="last_verified_at" class="form-control" value="{% if shelter and shelter.last_verified_at %}{{ shelter.last_verified_at.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
                </div>
              </div>

              <hr class="my-3">
              <h6>Facilities</h6>
              <div class="row g-2">
                <div class="col-auto">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="has_food" value="1" id="has_food" {% if shelter and shelter.has_food %}checked{% endif %}>
                    <label class="form-check-label" for="has_food">Food</label>
                  </div>
                </div>
                <div class="col-auto">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="has_drinking_water" value="1" id="has_drinking_water" {% if shelter and shelter.has_drinking_water %}checked{% endif %}>
                    <label class="form-check-label" for="has_drinking_water">Drinking water</label>
                  </div>
                </div>
                <div class="col-auto">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="has_medical_support" value="1" id="has_medical_support" {% if shelter and shelter.has_medical_support %}checked{% endif %}>
                    <label class="form-check-label" for="has_medical_support">Medical support</label>
                  </div>
                </div>
                <div class="col-auto">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="has_accessibility" value="1" id="has_accessibility" {% if shelter and shelter.has_accessibility %}checked{% endif %}>
                    <label class="form-check-label" for="has_accessibility">Accessibility</label>
                  </div>
                </div>
              </div>

              <div class="d-grid gap-2 d-sm-flex justify-content-end mt-4">
                <a class="btn btn-ghost" href="{{ url_for('admin.manage_shelters') }}">Cancel</a>
                <button class="btn btn-sz" type="submit">{{ action }} shelter</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
