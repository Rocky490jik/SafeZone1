{% extends "base.html" %}

{% block title %}Create account - SafeZone{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="form-card">
          <div class="form-header">
            <h2>Create your account</h2>
            <p>Join SafeZone to find shelters near you and view active alerts.</p>
          </div>
          <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
              <label for="full_name">Full name</label>
              <input type="text" name="full_name" id="full_name" class="form-control" placeholder="e.g. Aarav Patel" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" name="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="phone">Phone (optional)</label>
              <input type="tel" name="phone" id="phone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" required minlength="6" autocomplete="new-password">
                <button class="btn btn-outline-secondary btn-sm" type="button" id="togglePassword">Show</button>
              </div>
              <small class="form-text text-muted">At least 6 characters.</small>
            </div>
            <div class="form-group">
              <label for="confirm_password">Confirm password</label>
              <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="new-password">
            </div>
            <button class="btn btn-sz w-100 py-2" type="submit">Create account</button>
          </form>
          <div class="form-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  let showing = false;
  toggle.addEventListener('click', () => {
    showing = !showing;
    password.type = showing ? 'text' : 'password';
    toggle.textContent = showing ? 'Hide' : 'Show';
  });
</script>
{% endblock %}
