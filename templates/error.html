{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card card-sz text-center py-5">
          <h1 class="text-navy">{{ code }}</h1>
          <h3>{{ title }}</h3>
          <p class="text-muted">{{ message }}</p>
          <a class="btn btn-sz" href="{{ url_for('index') }}">Go home</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
