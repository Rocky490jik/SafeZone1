{% extends "base.html" %}

{% block title %}Profile - SafeZone{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card card-sz">
          <div class="card-header">
            <h5 class="mb-0">Your profile</h5>
          </div>
          <div class="card-body p-4">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <p class="form-control-plaintext">{{ user.full_name }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <p class="form-control-plaintext">{{ user.email }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <span class="badge badge-{{ 'verified' if user.role=='ADMIN' else 'pending' }}">{{ user.role }}</span>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <span class="badge badge-{{ 'open' if user.is_active else 'closed' }}">{{ 'Active' if user.is_active else 'Deactivated' }}</span>
            </div>
            <div class="mb-3">
              <label class="form-label">Member since</label>
              <p class="form-control-plaintext">{{ user.created_at }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
