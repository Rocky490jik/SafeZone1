{% extends "base.html" %}

{% block title %}Sign in - SafeZone{% endblock %}

{% block content %}
<section class="section-sm">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="form-card">
          <div class="form-header">
            <h2>Welcome back</h2>
            <p>Sign in to access your dashboard and shelter search.</p>
          </div>
          <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" name="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
                <button class="btn btn-outline-secondary btn-sm" type="button" id="togglePassword">Show</button>
              </div>
            </div>
            <div class="form-group d-flex justify-content-between align-items-center">
              <label class="form-check-label small">
                <input type="checkbox" class="form-check-input" name="remember"> Remember me
              </label>
              <a class="small text-teal" href="{{ url_for('auth.register') }}">Create an account</a>
            </div>
            <button class="btn btn-sz w-100 py-2" type="submit">Sign in</button>
          </form>
          <div class="form-footer">
            Don&rsquo;t have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  let showing = false;
  toggle.addEventListener('click', () => {
    showing = !showing;
    password.type = showing ? 'text' : 'password';
    toggle.textContent = showing ? 'Hide' : 'Show';
  });
</script>
{% endblock %}
